kind = "web"
previewPath = "/"
title = "ClauseShield"
description = "A contract risk auditing dashboard that turns uploaded PDFs into plain-English findings and negotiation-ready counter-clauses."
version = "1.0.0"
id = "artifacts/clauseshield"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 23703

[services.development]
run = "pnpm --filter @workspace/clauseshield run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/clauseshield", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/clauseshield/index.js"]

[services.production.run.env]
PORT = "23703"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"

[services.env]
PORT = "23703"
BASE_PATH = "/"
